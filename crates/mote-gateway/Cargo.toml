[package]
name = "mote-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-link-core = { git = "https://github.com/beelol/agent-engine", rev = "2dde203862150ea284bb0d5382e89cf58648b059", default-features = false }
anyhow = "1"
snow = "0.10"
getrandom = "0.3"
zeroize = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", features = ["sink"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
libc.workspace = true
mote-protocol.workspace = true
mote-ipc.workspace = true
mote-eventlog.workspace = true
mote-redact.workspace = true

[dev-dependencies]
tempfile = "3"
mote-host-client.workspace = true
