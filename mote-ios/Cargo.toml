[package]
name = "mote-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
eframe.workspace = true
egui.workspace = true
mote-client-core.workspace = true
mote-host-client.workspace = true
mote-gateway.workspace = true
mote-protocol.workspace = true
mote-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
libc.workspace = true
tempfile = "3"

[target.'cfg(target_os = "ios")'.dependencies]
raw-window-handle = "0.6.2"

[target.'cfg(all(target_os = "ios", target_abi = "sim"))'.dependencies]
egui-wgpu = "=0.31.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
mote-client-core = { workspace = true, features = ["test-observation"] }
mote-testkit.workspace = true
mote-ipc.workspace = true
moted = { path = "../moted", features = ["test-fixture"] }
