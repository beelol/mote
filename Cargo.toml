[workspace]
resolver = "2"
members = [
    "crates/mote-browser",
    "crates/matrix-lang",
    "crates/mote-redact",
    "crates/mote-paths",
    "crates/mote-eventlog",
    "crates/mote-protocol",
    "crates/mote-gateway",
    "crates/mote-host-client",
    "crates/mote-ipc",
    "crates/mote-localmodel",
    "crates/mote-harness",
    "crates/mote-hrns",
    "crates/mote-memory",
    "crates/mote-memory-sqlite",
    "crates/mote-context",
    "crates/mote-ui",
    "crates/mote-client-core",
    "crates/mote-voice-protocol",
    "crates/mote-testkit",
    "moted",
    "mote-client",
    "mote-ios",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
mote-browser = { path = "crates/mote-browser" }
mote-redact = { path = "crates/mote-redact" }
mote-paths = { path = "crates/mote-paths" }
mote-eventlog = { path = "crates/mote-eventlog" }
mote-protocol = { path = "crates/mote-protocol" }
mote-gateway = { path = "crates/mote-gateway" }
mote-host-client = { path = "crates/mote-host-client" }
mote-ipc = { path = "crates/mote-ipc" }
mote-localmodel = { path = "crates/mote-localmodel" }
mote-harness = { path = "crates/mote-harness" }
mote-hrns = { path = "crates/mote-hrns" }
mote-memory = { path = "crates/mote-memory" }
mote-memory-sqlite = { path = "crates/mote-memory-sqlite" }
mote-context = { path = "crates/mote-context" }
mote-ui = { path = "crates/mote-ui" }
mote-client-core = { path = "crates/mote-client-core" }
mote-voice-protocol = { path = "crates/mote-voice-protocol" }
mote-testkit = { path = "crates/mote-testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["json"] }
sysinfo = "0.32"
tiktoken-rs = "0.6"
sha2 = "0.10"
notify = "6"
schemars = "0.8"
cron = "0.12"
chrono = "0.4"
url = "2.5.8"
eframe = { version = "=0.31.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
egui = "=0.31.0"
accesskit = "=0.17.1"
accesskit_consumer = "=0.26.0"
